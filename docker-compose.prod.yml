# Trust Guard: production stack for a single server (VPS).
#
#   docker compose -f docker-compose.prod.yml --profile local-db up -d --build
#
# Caddy terminates HTTPS (automatic Let's Encrypt certificates) for two hostnames:
#   APP_HOST   -> the Next.js app
#   AUTH_HOST  -> Keycloak
# Only ports 80 and 443 are published; Keycloak and the databases stay on the
# internal Docker network. See docs/deploy-vps.md for the full walkthrough.
#
# All secrets come from `.env` (npm run setup). APP_URL, KEYCLOAK_ISSUER and
# DATABASE_URL are derived from APP_HOST / AUTH_HOST below, so the localhost
# values in `.env` do not need editing.
name: trust-guard-prod

x-app-env: &app-env
  NODE_ENV: production
  APP_URL: https://${APP_HOST:?Set APP_HOST in .env}
  KEYCLOAK_ISSUER: https://${AUTH_HOST:?Set AUTH_HOST in .env}/realms/trust-guard
  # Defaults to the bundled app-db container. To use Supabase instead, set
  # PROD_DATABASE_URL (and DATABASE_SSL=true) in .env and drop --profile local-db.
  DATABASE_URL: ${PROD_DATABASE_URL:-postgresql://trustguard:${APP_DB_PASSWORD}@app-db:5432/trustguard}

services:
  # ---------------------------------------------------------------------------
  # Reverse proxy and TLS.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST}
      AUTH_HOST: ${AUTH_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        # The app reaches Keycloak by its public URL (the OIDC issuer must match);
        # these aliases keep that traffic on the Docker network, through Caddy.
        aliases:
          - ${APP_HOST}
          - ${AUTH_HOST}

  # ---------------------------------------------------------------------------
  # Identity provider: Keycloak in production mode, with its own database.
  # ---------------------------------------------------------------------------
  keycloak-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    # --import-realm imports the trust-guard realm on first start only.
    command: ["start", "--import-realm"]
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      # Behind Caddy: plain HTTP inside the network, public HTTPS hostname outside.
      KC_HOSTNAME: https://${AUTH_HOST}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # Placeholders substituted into keycloak/import/trust-guard-realm.json at import.
      TG_APP_URL: https://${APP_HOST}
      TG_KC_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-trust-guard-bff}
      TG_KC_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      TG_KC_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
      TG_BACKCHANNEL_LOGOUT_URL: http://app:3000/api/auth/backchannel-logout
      TG_SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
      TG_SEED_EMPLOYEE_PASSWORD: ${SEED_EMPLOYEE_PASSWORD:?Set SEED_EMPLOYEE_PASSWORD in .env}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Application database. Skip with a Supabase PROD_DATABASE_URL (see above).
  # ---------------------------------------------------------------------------
  app-db:
    profiles: ["local-db"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustguard
      POSTGRES_USER: trustguard
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustguard -d trustguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending SQL migrations, then exits. Uses the image's
  # build stage, which still has the dev dependencies (tsx).
  migrate:
    build:
      context: .
      target: build
    command: ["npx", "tsx", "scripts/db-migrate.ts"]
    env_file: .env
    environment: *app-env
    restart: "no"
    depends_on:
      app-db:
        condition: service_healthy
        required: false

  # ---------------------------------------------------------------------------
  # Trust Guard app (Next.js standalone server).
  # ---------------------------------------------------------------------------
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
  keycloak-db-data:
  app-db-data:
